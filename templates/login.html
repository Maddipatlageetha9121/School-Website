<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=devicewidth" initial-scale="1.0">
        <title>login page</title>
        <style>
             /* General styles */
    body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  nav img {
    width: 100%;
    margin-bottom: 200%;
    margin-left: 160%;
  }
  
  /* Login container */
  .login-container {
    background: #ffffff;
    padding: 20px 30px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 400px;
    text-align: bottom;
    margin-top: 15%;
    margin-right: 15%;
  }
  
  h1 {
    margin-bottom: 20px;
    font-size: 24px;
    color: #333;
  }
  
  /* Form group */
  .form-group {
    margin-bottom: 15px;
    text-align: left;
  }
  
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
    color: #555;
  }
  
  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  
  input:focus {
    border-color: #007bff;
    outline: none;
  }
  
  /* Submit button */
  .btn {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  
  .btn:hover {
    background-color: #0056b3;
  }
  
  /* Register link */
  .register-link {
    margin-top: 15px;
    font-size: 14px;
  }
  
  .register-link a {
    color: #007bff;
    text-decoration: none;
  }
  
  .register-link a:hover {
    text-decoration: underline;
  }
        </style>
        <body>
          <nav>
            <img src="https://tse1.mm.bing.net/th?id=OIP.zNUSFf1aeErMeOFY9s1--QHaHa&pid=Api&P=0&h=180">
          </nav>
            <div class="login-container">
                <h1>login form</h1>
                <form action="/login" method="post">
                    <div class="form-group">
                        <label for="username"></label>
                        <input type="text" id="username" name="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="password"></label>
                        <input type="password" id="password" name="password" placeholder="password" required>
                    </div>
                    <button type="submit" class="btn">login</button>
                </form>
            </div>
        </body>
    </head>
</html>
